services:
  vert:
    build:
      context: .
      args:
        PUB_ENV: ${PUB_ENV}
        PUB_HOSTNAME: ${PUB_HOSTNAME}
        PUB_PLAUSIBLE_URL: ${PUB_PLAUSIBLE_URL}
        PUB_VERTD_URL: ${PUB_VERTD_URL}
        PUB_DONATION_URL: ${PUB_DONATION_URL}
        PUB_STRIPE_KEY: ${PUB_STRIPE_KEY}
    env_file:
      - .env
    image: vert-sh/vert
    container_name: vert
    ports:
      - "1682:80"
    restart: unless-stopped
    labels:
      - 'traefik.http.routers.vert.rule=HostRegexp(`^vert\..+$`) || PathPrefix(`/vert`)'
      - "traefik.http.middlewares.vert-remove-prefix.stripprefix.prefixes=/vert"
      - "traefik.http.routers.vert.middlewares=vert-remove-prefix"
      - "traefik.http.services.vert.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"
    networks:
      - default
      - traefik-network
networks:
  traefik-network:
    external: true
